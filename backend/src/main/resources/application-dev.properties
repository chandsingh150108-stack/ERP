# H2 in-memory database for local development (no Docker needed)
spring.datasource.url=jdbc:h2:mem:student_erp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create

# Vault
vault.upload-dir=./uploads/vault

# NoteHub
notehub.upload-dir=./uploads/notehub

# Assignment
assignment.upload-dir=./uploads/assignments

# Certificate
certificate.upload-dir=./uploads/certificates

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
