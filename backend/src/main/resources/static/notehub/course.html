<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Notes - NoteHub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155}
.header h1{font-size:20px;font-weight:600}
.header h1 span{color:#3b82f6}
.nav-links{display:flex;gap:8px}
.nav-link{color:#94a3b8;text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid #475569;border-radius:6px;transition:all .2s}
.nav-link:hover{color:#e2e8f0;border-color:#64748b}
.container{max-width:1100px;margin:0 auto;padding:24px}

.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.card-header h2{font-size:16px;font-weight:600}

.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:14px;outline:none;transition:border-color .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:#3b82f6}
select:disabled{opacity:0.5;cursor:not-allowed}
textarea{resize:vertical;min-height:80px}

.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-outline{background:transparent;border:1px solid #475569;color:#94a3b8}.btn-outline:hover{border-color:#64748b;color:#e2e8f0}
.btn-sm{padding:6px 12px;font-size:12px}

.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.note-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:all .2s}
.note-card:hover{border-color:#3b82f6}
.note-header{margin-bottom:10px}
.note-title{font-size:16px;font-weight:600;color:#e2e8f0;margin-bottom:8px;line-height:1.4}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;background:#334155;color:#94a3b8}
.tag.tag-year{background:#1e3a5f;color:#60a5fa}
.tag.tag-course{background:#2d1b4e;color:#a78bfa}
.tag.tag-subject{background:#1e3a2f;color:#4ade80}
.tag.tag-unit{background:#3b1f2b;color:#f472b6}

.note-desc{font-size:13px;color:#94a3b8;margin-bottom:14px;line-height:1.5;flex-grow:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-meta{font-size:12px;color:#64748b;margin-bottom:14px;display:flex;flex-direction:column;gap:3px;border-top:1px solid #334155;padding-top:10px}

.note-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #334155;padding-top:12px}
.btn-vote{background:#0f172a;border:1px solid #334155;color:#94a3b8;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-vote:hover{border-color:#3b82f6;color:#e2e8f0}
.btn-vote.voted{background:#1e3a5f;border-color:#3b82f6;color:#60a5fa}

.load-more-bar{text-align:center;margin-top:24px}
.empty-state{text-align:center;padding:48px;color:#64748b;background:#1e293b;border:1px dashed #334155;border-radius:12px;grid-column:1/-1}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px;color:#e2e8f0}
.modal .form-group{margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid #334155}

.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px 20px;font-size:14px;z-index:200;animation:slideUp .3s ease;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
.toast.success{border-color:#22c55e;color:#4ade80}
.toast.error{border-color:#ef4444;color:#f87171}
.profile-btn{background:linear-gradient(135deg,#1e293b,#0f172a);color:#38bdf8;border:1px solid #38bdf8;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s ease;box-shadow:0 2px 6px rgba(56,189,248,.15)}
.profile-btn:hover{background:#38bdf8;color:#0f172a;box-shadow:0 4px 12px rgba(56,189,248,.3);transform:translateY(-1px)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="header">
  <h1><span>N</span>oteHub <span>•</span> Course Notes</h1>
  <div class="nav-links">
    <button id="profile-btn" class="profile-btn" onclick="openProfileModal()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Profile
    </button>
    <a href="/faculty" class="nav-link">Faculty</a>
    <a href="/notehub" class="nav-link">Back to NoteHub</a>
    <a href="/" class="nav-link">Dashboard</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Filter Course Notes</h2>
      <button class="btn btn-primary" onclick="openUploadModal()">+ Upload Course Note</button>
    </div>
    <div class="filter-grid">
      <div class="form-group">
        <label>Year</label>
        <select id="filter-year" onchange="onFilterYearChange()">
          <option value="">All Years</option>
          <option value="1">FY (Year 1)</option>
          <option value="2">SY (Year 2)</option>
          <option value="3">TY (Year 3)</option>
          <option value="4">Final (Year 4)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Course / Branch</label>
        <select id="filter-course" onchange="onFilterCourseChange()">
          <option value="">All Courses / Branches</option>
        </select>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <select id="filter-subject" onchange="onFilterParamChange()" disabled>
          <option value="">All Subjects</option>
        </select>
      </div>
      <div class="form-group">
        <label>Unit</label>
        <select id="filter-unit" onchange="onFilterParamChange()">
          <option value="">All Units</option>
          <option value="I">Unit I</option>
          <option value="II">Unit II</option>
          <option value="III">Unit III</option>
          <option value="IV">Unit IV</option>
          <option value="V">Unit V</option>
          <option value="VI">Unit VI</option>
        </select>
      </div>
    </div>
  </div>

  <div class="notes-grid" id="notes-grid">
    <div class="empty-state">Loading notes...</div>
  </div>

  <div class="load-more-bar" id="load-more-bar" style="display:none">
    <button class="btn btn-outline" onclick="loadMore()">Load More Notes</button>
  </div>
</div>

<!-- Upload Modal -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <h3>Upload Course Note</h3>
    <div class="form-group">
      <label>PDF Note File (PDF Only)</label>
      <input type="file" id="modal-file" accept=".pdf,application/pdf" required>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="modal-title" placeholder="e.g. Unit 3 Trees & Graphs Summary" required>
    </div>
    <div class="form-group">
      <label>Description (Optional)</label>
      <textarea id="modal-desc" placeholder="Brief description of the uploaded note..."></textarea>
    </div>
    <div class="form-group">
      <label>Study Year</label>
      <select id="modal-year" onchange="onModalYearChange()" required>
        <option value="">Select Year</option>
        <option value="1">FY (Year 1)</option>
        <option value="2">SY (Year 2)</option>
        <option value="3">TY (Year 3)</option>
        <option value="4">Final (Year 4)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Course / Branch</label>
      <select id="modal-course" onchange="onModalCourseChange()" required>
        <option value="">Select Course / Branch</option>
      </select>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <select id="modal-subject" required disabled>
        <option value="">Select Year and Course first</option>
      </select>
    </div>
    <div class="form-group">
      <label>Unit</label>
      <select id="modal-unit" required>
        <option value="">Select Unit</option>
        <option value="I">Unit I</option>
        <option value="II">Unit II</option>
        <option value="III">Unit III</option>
        <option value="IV">Unit IV</option>
        <option value="V">Unit V</option>
        <option value="VI">Unit VI</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeUploadModal()">Cancel</button>
      <button class="btn btn-primary" id="btn-submit-upload" onclick="submitUpload()">Upload</button>
    </div>
  </div>
</div>

<!-- Student Profile Modal -->
<div class="modal-overlay" id="profile-modal" onclick="if(event.target===this)closeProfileModal()">
  <div class="modal" style="max-width:480px;border-color:#38bdf8">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #334155;padding-bottom:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#0284c7;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px" id="prof-avatar">ST</div>
        <div>
          <h3 style="margin:0;font-size:17px;color:#f8fafc" id="prof-fullname">Student Profile</h3>
          <span style="font-size:12px;color:#94a3b8" id="prof-rollno">Roll No</span>
        </div>
      </div>
      <button onclick="closeProfileModal()" style="background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;line-height:1">&times;</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Course / Branch</div>
        <div style="font-size:14px;color:#38bdf8;font-weight:600;margin-top:2px" id="prof-course">-</div>
      </div>
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Class / Year</div>
        <div style="font-size:14px;color:#4ade80;font-weight:600;margin-top:2px" id="prof-year">-</div>
      </div>
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Current Semester</div>
        <div style="font-size:14px;color:#e2e8f0;font-weight:600;margin-top:2px" id="prof-sem">-</div>
      </div>
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Account Status</div>
        <div style="font-size:14px;color:#a855f7;font-weight:600;margin-top:2px" id="prof-status">ACTIVE</div>
      </div>
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155;grid-column:1 / -1">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Degree Program</div>
        <div style="font-size:13px;color:#e2e8f0;font-weight:500;margin-top:2px" id="prof-program">-</div>
      </div>
      <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155;grid-column:1 / -1">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">College Email</div>
        <div style="font-size:13px;color:#94a3b8;font-weight:500;margin-top:2px" id="prof-email">-</div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeProfileModal()">Close</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/'; }

function authHeaders() {
  return { 'Authorization': 'Bearer ' + token };
}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function formatDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function getCurrentUser() {
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    let role = localStorage.getItem('role') || '';
    if (!role) {
      const u = localStorage.getItem('user');
      if (u) {
        try { role = JSON.parse(u).role || ''; } catch(e){}
      }
    }
    return { username: payload.sub, role };
  } catch (e) {
    return { username: '', role: '' };
  }
}

const currentUser = getCurrentUser();

const BRANCHES = [
  { code: 'DESH', name: 'DESH (First Year Common)', years: [1] },
  { code: 'CSE',  name: 'CSE (Computer Science & Engineering)', years: [2, 3, 4] },
  { code: 'AIML', name: 'CSE - AI & Machine Learning (AIML)', years: [2, 3, 4] },
  { code: 'AIDS', name: 'CSE - AI & Data Science (AIDS)', years: [2, 3, 4] },
  { code: 'IT',   name: 'Information Technology (IT)', years: [2, 3, 4] },
  { code: 'MECH', name: 'Mechanical Engineering (MECH)', years: [2, 3, 4] },
  { code: 'ENTC', name: 'Electronics & Telecommunication (ENTC)', years: [2, 3, 4] },
  { code: 'CHEM', name: 'Chemical Engineering (CHEM)', years: [2, 3, 4] },
  { code: 'INST', name: 'Instrumentation Engineering (INST)', years: [2, 3, 4] }
];

let modalSubjectsMap = {};
let currentPage = 0;
const pageSize = 5;
let totalNotesCount = 0;
let currentNotes = [];

function populateFilterCourses() {
  const year = document.getElementById('filter-year').value;
  const courseSelect = document.getElementById('filter-course');
  courseSelect.innerHTML = '';

  if (year === '1') {
    courseSelect.innerHTML = '<option value="DESH">DESH (First Year Common)</option>';
    courseSelect.value = 'DESH';
  } else if (year === '2' || year === '3' || year === '4') {
    const yrNum = parseInt(year, 10);
    const yrLabel = year === '2' ? 'SY' : (year === '3' ? 'TY' : 'Final Year');
    let html = `<option value="">All ${yrLabel} Courses / Branches</option>`;
    BRANCHES.filter(b => b.years.includes(yrNum)).forEach(b => {
      html += `<option value="${b.code}">${b.name}</option>`;
    });
    courseSelect.innerHTML = html;
  } else {
    let html = '<option value="">All Courses / Branches</option>';
    BRANCHES.forEach(b => {
      html += `<option value="${b.code}">${b.name}</option>`;
    });
    courseSelect.innerHTML = html;
  }
}

async function onFilterYearChange() {
  populateFilterCourses();
  await onFilterCourseChange();
}

async function onFilterCourseChange() {
  const year = document.getElementById('filter-year').value;
  const branch = document.getElementById('filter-course').value;
  const subjSelect = document.getElementById('filter-subject');

  subjSelect.innerHTML = '<option value="">All Subjects</option>';

  if (year || branch) {
    subjSelect.disabled = false;
    let url = '/api/notehub/subjects?';
    if (year) url += `year=${encodeURIComponent(year)}&`;
    if (branch) url += `department=${encodeURIComponent(branch)}&`;
    try {
      const res = await fetch(url, { headers: authHeaders() });
      if (res.ok) {
        const subjects = await res.json();
        subjects.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.code} - ${s.name}`;
          subjSelect.appendChild(opt);
        });
      }
    } catch (e) {}
  } else {
    subjSelect.disabled = true;
  }
  onFilterParamChange();
}

function onFilterParamChange() {
  currentPage = 0;
  currentNotes = [];
  fetchNotes(false);
}

async function fetchNotes(isAppend = false) {
  const year = document.getElementById('filter-year').value;
  const branch = document.getElementById('filter-course').value;
  const subjectId = document.getElementById('filter-subject').value;
  const unit = document.getElementById('filter-unit').value;

  let url = `/api/notehub/notes?page=${currentPage}&size=${pageSize}`;
  if (year) url += `&year=${encodeURIComponent(year)}`;
  if (branch) url += `&department=${encodeURIComponent(branch)}`;
  if (subjectId) url += `&subjectId=${encodeURIComponent(subjectId)}`;
  if (unit) url += `&unit=${encodeURIComponent(unit)}`;

  try {
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) throw new Error('Failed to load notes');
    
    const countHeader = res.headers.get('X-Total-Count');
    if (countHeader !== null) {
      totalNotesCount = parseInt(countHeader, 10);
    }

    const notes = await res.json();
    if (isAppend) {
      currentNotes = currentNotes.concat(notes);
    } else {
      currentNotes = notes;
    }

    renderNotes();
  } catch (e) {
    document.getElementById('notes-grid').innerHTML = `<div class="empty-state">Error: ${e.message}</div>`;
  }
}

function renderNotes() {
  const grid = document.getElementById('notes-grid');
  if (currentNotes.length === 0) {
    grid.innerHTML = '<div class="empty-state">No notes found matching the selected criteria. Be the first to upload one!</div>';
    document.getElementById('load-more-bar').style.display = 'none';
    return;
  }

  grid.innerHTML = '';
  currentNotes.forEach(note => {
    const card = document.createElement('div');
    card.className = 'note-card';

    const uploaderUser = (note.uploader && note.uploader.user) ? note.uploader.user.username : '';
    const isOwner = uploaderUser && uploaderUser === currentUser.username;
    const isAdminOrFaculty = currentUser.role === 'ADMIN' || currentUser.role === 'FACULTY' || (currentUser.role && currentUser.role.includes('ADMIN')) || (currentUser.role && currentUser.role.includes('FACULTY'));
    const canDelete = isOwner || isAdminOrFaculty;

    const uploaderName = note.uploader ? `${note.uploader.firstName || ''} ${note.uploader.lastName || ''}`.trim() || 'Student' : 'Student';
    const uploaderRoll = note.uploader && note.uploader.rollNumber ? ` (${note.uploader.rollNumber})` : '';
    const deptTag = (note.course && note.course.department) ? note.course.department.code : (note.course ? note.course.code : '');

    card.innerHTML = `
      <div class="note-header">
        <div class="note-title">${escapeHtml(note.title)}</div>
        <div class="tag-list">
          ${note.studyYear ? `<span class="tag tag-year">Year ${note.studyYear}</span>` : ''}
          ${deptTag ? `<span class="tag tag-course">${escapeHtml(deptTag)}</span>` : ''}
          ${note.subject ? `<span class="tag tag-subject">${escapeHtml(note.subject.name)}</span>` : ''}
          ${note.unit ? `<span class="tag tag-unit">Unit ${escapeHtml(note.unit)}</span>` : ''}
        </div>
      </div>
      ${note.description ? `<div class="note-desc">${escapeHtml(note.description)}</div>` : '<div class="note-desc" style="font-style:italic">No description provided.</div>'}
      <div class="note-meta">
        <div><strong>Uploaded by:</strong> ${escapeHtml(uploaderName)}${escapeHtml(uploaderRoll)}</div>
        <div><strong>File:</strong> ${escapeHtml(note.fileName)} • ${formatFileSize(note.fileSize)} • ${formatDate(note.createdAt)}</div>
      </div>
      <div class="note-actions">
        <button class="btn-vote" id="vote-btn-${note.id}" onclick="toggleUpvote(${note.id})">
          ▲ <span id="vote-count-${note.id}">${note.voteCount || 0}</span>
        </button>
        <div style="display:flex;gap:6px">
          <a class="btn btn-outline btn-sm" href="/api/notehub/notes/${note.id}/download" target="_blank" download>Download PDF</a>
          ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteNote(${note.id})">Delete</button>` : ''}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  const loadMoreBar = document.getElementById('load-more-bar');
  if (currentNotes.length < totalNotesCount) {
    loadMoreBar.style.display = 'block';
  } else {
    loadMoreBar.style.display = 'none';
  }
}

function loadMore() {
  currentPage++;
  fetchNotes(true);
}

async function toggleUpvote(noteId) {
  try {
    const res = await fetch(`/api/notehub/notes/${noteId}/upvote`, {
      method: 'POST',
      headers: authHeaders()
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || 'Upvote failed. Ensure you are logged in as a student.');
    }
    const data = await res.json();
    const countSpan = document.getElementById(`vote-count-${noteId}`);
    const btn = document.getElementById(`vote-btn-${noteId}`);
    if (countSpan) countSpan.textContent = data.voteCount;
    if (btn) btn.classList.toggle('voted', data.voted);

    const target = currentNotes.find(n => n.id === noteId);
    if (target) target.voteCount = data.voteCount;
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteNote(noteId) {
  if (!confirm('Are you sure you want to delete this note?')) return;
  try {
    const res = await fetch(`/api/notehub/notes/${noteId}`, {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || 'Failed to delete note');
    }
    toast('Note deleted successfully');
    currentNotes = currentNotes.filter(n => n.id !== noteId);
    totalNotesCount = Math.max(0, totalNotesCount - 1);
    renderNotes();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function openUploadModal() {
  document.getElementById('upload-modal').classList.add('show');
}

function closeUploadModal() {
  document.getElementById('upload-modal').classList.remove('show');
}

function onModalYearChange() {
  const year = document.getElementById('modal-year').value;
  const courseSelect = document.getElementById('modal-course');
  const subjSelect = document.getElementById('modal-subject');

  subjSelect.innerHTML = '<option value="">Select Course / Branch first</option>';
  subjSelect.disabled = true;

  if (year === '1') {
    courseSelect.innerHTML = '<option value="DESH">DESH (First Year Common)</option>';
    courseSelect.value = 'DESH';
    onModalCourseChange();
  } else if (year === '2' || year === '3' || year === '4') {
    const yrNum = parseInt(year, 10);
    let html = '<option value="">Select Course / Branch</option>';
    BRANCHES.filter(b => b.years.includes(yrNum)).forEach(b => {
      html += `<option value="${b.code}">${b.name}</option>`;
    });
    courseSelect.innerHTML = html;
  } else {
    courseSelect.innerHTML = '<option value="">Select Study Year first</option>';
  }
}

async function onModalCourseChange() {
  const year = document.getElementById('modal-year').value;
  const branch = document.getElementById('modal-course').value;
  const subjSelect = document.getElementById('modal-subject');

  modalSubjectsMap = {};
  subjSelect.innerHTML = '<option value="">Loading subjects...</option>';

  if (year && branch) {
    subjSelect.disabled = false;
    try {
      const res = await fetch(`/api/notehub/subjects?year=${encodeURIComponent(year)}&department=${encodeURIComponent(branch)}`, {
        headers: authHeaders()
      });
      if (res.ok) {
        const subjects = await res.json();
        if (subjects.length === 0) {
          subjSelect.innerHTML = '<option value="">No subjects found for this Course & Year</option>';
        } else {
          subjSelect.innerHTML = '<option value="">Select Subject</option>';
          subjects.forEach(s => {
            modalSubjectsMap[s.id] = s;
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.code} - ${s.name}`;
            subjSelect.appendChild(opt);
          });
        }
      }
    } catch (e) {
      subjSelect.innerHTML = '<option value="">Error loading subjects</option>';
    }
  } else {
    subjSelect.disabled = true;
    subjSelect.innerHTML = '<option value="">Select Year and Course first</option>';
  }
}

async function submitUpload() {
  const fileInput = document.getElementById('modal-file');
  const title = document.getElementById('modal-title').value.trim();
  const desc = document.getElementById('modal-desc').value.trim();
  const year = document.getElementById('modal-year').value;
  const branch = document.getElementById('modal-course').value;
  const subjectId = document.getElementById('modal-subject').value;
  const unit = document.getElementById('modal-unit').value;

  if (!fileInput.files || fileInput.files.length === 0) {
    toast('Please select a PDF file to upload', 'error');
    return;
  }

  const file = fileInput.files[0];
  if (!file.name.toLowerCase().endsWith('.pdf') || (file.type && file.type !== 'application/pdf')) {
    toast('Only PDF files are allowed', 'error');
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    toast('File size exceeds the 50MB limit', 'error');
    return;
  }

  if (!title) {
    toast('Please enter a note title', 'error');
    return;
  }
  if (!year || !branch || !subjectId || !unit) {
    toast('Please complete all Year, Course, Subject, and Unit selections', 'error');
    return;
  }

  const selectedSubject = modalSubjectsMap[subjectId];
  if (!selectedSubject || !selectedSubject.course) {
    toast('Invalid subject selected', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('file', file);
  formData.append('title', title);
  if (desc) formData.append('description', desc);
  formData.append('noteType', 'COURSE');
  formData.append('studyYear', year);
  formData.append('courseId', selectedSubject.course.id);
  formData.append('subjectId', selectedSubject.id);
  formData.append('unit', unit);

  const submitBtn = document.getElementById('btn-submit-upload');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading...';

  try {
    const res = await fetch('/api/notehub/notes', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token
      },
      body: formData
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || 'Failed to upload note');
    }

    toast('Course note uploaded successfully!');
    closeUploadModal();
    // Reset form
    fileInput.value = '';
    document.getElementById('modal-title').value = '';
    document.getElementById('modal-desc').value = '';
    document.getElementById('modal-year').value = '';
    document.getElementById('modal-course').value = '';
    document.getElementById('modal-subject').value = '';
    document.getElementById('modal-subject').disabled = true;
    document.getElementById('modal-unit').value = '';

    onFilterParamChange();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Upload';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

let studentProfile = null;
async function fetchProfileData() {
  try {
    const res = await fetch('/api/vault/profile', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.ok) {
      studentProfile = await res.json();
      updateProfileModalData();
    }
  } catch (e) {
    console.warn('Profile fetch error', e);
  }
}

function updateProfileModalData() {
  if (!studentProfile) return;
  const fn = (studentProfile.firstName || '') + ' ' + (studentProfile.lastName || '');
  document.getElementById('prof-fullname').textContent = fn.trim() || 'Student';
  document.getElementById('prof-rollno').textContent = 'Roll No: ' + (studentProfile.rollNumber || 'N/A');
  const initials = ((studentProfile.firstName?.[0] || '') + (studentProfile.lastName?.[0] || '')).toUpperCase() || 'ST';
  document.getElementById('prof-avatar').textContent = initials;
  document.getElementById('prof-course').textContent = studentProfile.course || 'N/A';
  document.getElementById('prof-year').textContent = (studentProfile.year || 'N/A') + ' (Year ' + (studentProfile.studyYear || '-') + ')';
  document.getElementById('prof-sem').textContent = studentProfile.currentSemester ? ('Semester ' + studentProfile.currentSemester) : 'N/A';
  document.getElementById('prof-status').textContent = studentProfile.status || 'ACTIVE';
  document.getElementById('prof-program').textContent = studentProfile.program ? (studentProfile.program.name + ' (' + studentProfile.program.code + ')') : (studentProfile.course || 'Undergraduate Degree');
  document.getElementById('prof-email').textContent = studentProfile.email || (studentProfile.rollNumber ? (studentProfile.rollNumber.toLowerCase() + '@college.edu') : 'N/A');
}

function openProfileModal() {
  if (!studentProfile) {
    fetchProfileData().then(() => document.getElementById('profile-modal').classList.add('show'));
  } else {
    updateProfileModalData();
    document.getElementById('profile-modal').classList.add('show');
  }
}

function closeProfileModal() {
  document.getElementById('profile-modal').classList.remove('show');
}

populateFilterCourses();
fetchNotes(false);
fetchProfileData();
