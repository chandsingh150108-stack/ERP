<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student ERP</title>
    <script type="module" crossorigin src="/assets/index-D74l2asG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-sOQ1tcUM.css">
    <style>
      /* Navigation Sidebar */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 9998;
      }
      .sidebar-overlay.show { display: block; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        background: #1e293b;
        border-right: 1px solid #334155;
        z-index: 9999;
        display: none;
        flex-direction: column;
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow-y: auto;
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }
      .sidebar.show { display: flex; }
      .sidebar-header {
        padding: 20px 18px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sidebar-header h2 {
        font-size: 16px;
        font-weight: 700;
        color: #e2e8f0;
        margin: 0;
      }
      .sidebar-header h2 span { color: #3b82f6; }
      .sidebar-nav {
        flex: 1;
        padding: 12px 0;
      }
      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        color: #94a3b8;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
        border-left: 3px solid transparent;
      }
      .sidebar-nav a:hover {
        color: #e2e8f0;
        background: rgba(255,255,255,0.03);
        border-left-color: #334155;
      }
      .sidebar-nav a.active {
        color: #3b82f6;
        background: rgba(59,130,246,0.08);
        border-left-color: #3b82f6;
      }
      .sidebar-nav a .icon {
        font-size: 16px;
        width: 20px;
        text-align: center;
      }
      .sidebar-divider {
        height: 1px;
        background: #334155;
        margin: 8px 18px;
      }
      .sidebar-label {
        padding: 8px 18px 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        font-weight: 600;
      }
      .sidebar-footer {
        padding: 12px 18px;
        border-top: 1px solid #334155;
      }
      .sidebar-footer a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        color: #64748b;
        text-decoration: none;
        font-size: 12px;
        transition: color 0.15s;
      }
      .sidebar-footer a:hover { color: #e2e8f0; }
      .hamburger-btn {
        position: fixed;
        top: 14px;
        left: 16px;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: #38bdf8;
        border: 1px solid #38bdf8;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 10px rgba(56,189,248,0.2);
      }
      .hamburger-btn:hover {
        background: #38bdf8;
        color: #0f172a;
        transform: translateY(-1px);
      }
      @media (max-width: 768px) {
        .hamburger-btn { display: inline-flex; }
        .sidebar { width: 240px; }
      }
      .global-profile-fab {
        position: fixed;
        top: 14px;
        right: 20px;
        z-index: 9999;
        display: none;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: #38bdf8;
        border: 1px solid #38bdf8;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 10px rgba(56,189,248,0.2);
        transition: all 0.2s ease;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .global-profile-fab:hover {
        background: #38bdf8;
        color: #0f172a;
        box-shadow: 0 6px 20px rgba(56,189,248,0.4);
        transform: translateY(-1px);
      }
      .prof-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        z-index: 10000;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .prof-modal-overlay.show { display: flex; }
      .prof-modal-card {
        background: #1e293b;
        border: 1px solid #38bdf8;
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        max-width: 480px;
        color: #e2e8f0;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hamburger Menu Button -->
    <button id="hamburger-btn" class="hamburger-btn" onclick="toggleSidebar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Navigation Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2><span>S</span>ERP</h2>
      </div>
      <div class="sidebar-nav">
        <a href="/" id="nav-dashboard">Dashboard</a>
        <a href="/vault/" id="nav-vault">Vault</a>
        <a href="/notehub/" id="nav-notehub">NoteHub</a>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Academics</div>
        <a href="/academics/" id="nav-academics">Academics</a>
        <a href="/assignment/" id="nav-assignment">Assignments</a>
        <a href="/examination/" id="nav-examination">Examinations</a>
        <a href="/timetable/" id="nav-timetable">Timetable</a>
        <a href="/certificate/" id="nav-certificate">Certificates</a>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Campus</div>
        <a href="/events/" id="nav-events">Events</a>
        <a href="/feedback/" id="nav-feedback">Feedback</a>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Finance</div>
        <a href="/accounts/" id="nav-accounts">Accounts</a>
      </div>
      <div class="sidebar-footer">
        <a href="javascript:void(0)" onclick="closeSidebar()">✕ Close Menu</a>
      </div>
    </nav>

    <!-- Global Top-Right Profile Button for Students & Users -->
    <button id="global-profile-btn" class="global-profile-fab" onclick="openGlobalProfile()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span id="global-profile-label">Profile</span>
    </button>

    <!-- Profile Modal -->
    <div class="prof-modal-overlay" id="global-profile-modal" onclick="if(event.target===this)closeGlobalProfile()">
      <div class="prof-modal-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #334155;padding-bottom:12px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:42px;height:42px;border-radius:50%;background:#0284c7;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px" id="gp-avatar">ST</div>
            <div>
              <h3 style="margin:0;font-size:17px;color:#f8fafc" id="gp-name">Student Profile</h3>
              <span style="font-size:12px;color:#94a3b8" id="gp-roll">Roll No</span>
            </div>
          </div>
          <button onclick="closeGlobalProfile()" style="background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;line-height:1">&times;</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Course / Branch</div>
            <div style="font-size:14px;color:#38bdf8;font-weight:600;margin-top:2px" id="gp-course">-</div>
          </div>
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Class / Year</div>
            <div style="font-size:14px;color:#4ade80;font-weight:600;margin-top:2px" id="gp-year">-</div>
          </div>
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Current Semester</div>
            <div style="font-size:14px;color:#e2e8f0;font-weight:600;margin-top:2px" id="gp-sem">-</div>
          </div>
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Account Status</div>
            <div style="font-size:14px;color:#a855f7;font-weight:600;margin-top:2px" id="gp-status">ACTIVE</div>
          </div>
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155;grid-column:1 / -1">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">Degree Program</div>
            <div style="font-size:13px;color:#e2e8f0;font-weight:500;margin-top:2px" id="gp-prog">-</div>
          </div>
          <div style="background:#0f172a;padding:10px 12px;border-radius:8px;border:1px solid #334155;grid-column:1 / -1">
            <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600">College Email</div>
            <div style="font-size:13px;color:#94a3b8;font-weight:500;margin-top:2px" id="gp-email">-</div>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end">
          <button style="background:transparent;border:1px solid #475569;color:#94a3b8;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer" onclick="closeGlobalProfile()">Close</button>
        </div>
      </div>
    </div>

    <script>
      let gStudentProfile = null;
      function checkAuthProfile() {
        const token = localStorage.getItem('token');
        const btn = document.getElementById('global-profile-btn');
        if (token) {
          btn.style.display = 'inline-flex';
          if (!gStudentProfile) {
            fetch('/api/vault/profile', {
              headers: { 'Authorization': 'Bearer ' + token }
            }).then(r => r.ok ? r.json() : null)
              .then(data => {
                if (data) {
                  gStudentProfile = data;
                  const label = document.getElementById('global-profile-label');
                  if (data.rollNumber) label.textContent = data.rollNumber + ' Profile';
                }
              }).catch(() => {});
          }
        } else {
          btn.style.display = 'none';
        }
      }
      function openGlobalProfile() {
        const token = localStorage.getItem('token');
        if (!token) return;
        const populate = (d) => {
          if (!d) return;
          const fn = (d.firstName || '') + ' ' + (d.lastName || '');
          document.getElementById('gp-name').textContent = fn.trim() || 'Student';
          document.getElementById('gp-roll').textContent = 'Roll No: ' + (d.rollNumber || 'N/A');
          const initials = ((d.firstName?.[0] || '') + (d.lastName?.[0] || '')).toUpperCase() || 'ST';
          document.getElementById('gp-avatar').textContent = initials;
          document.getElementById('gp-course').textContent = d.course || 'N/A';
          document.getElementById('gp-year').textContent = (d.year || 'N/A') + ' (Year ' + (d.studyYear || '-') + ')';
          document.getElementById('gp-sem').textContent = d.currentSemester ? ('Semester ' + d.currentSemester) : 'N/A';
          document.getElementById('gp-status').textContent = d.status || 'ACTIVE';
          document.getElementById('gp-prog').textContent = d.program ? (d.program.name + ' (' + d.program.code + ')') : (d.course || 'Undergraduate Degree');
          document.getElementById('gp-email').textContent = d.email || (d.rollNumber ? (d.rollNumber.toLowerCase() + '@college.edu') : 'N/A');
          document.getElementById('global-profile-modal').classList.add('show');
        };

        if (gStudentProfile) {
          populate(gStudentProfile);
        } else {
          fetch('/api/vault/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
          }).then(r => r.json()).then(data => {
            gStudentProfile = data;
            populate(data);
          }).catch(e => console.error(e));
        }
      }
      function closeGlobalProfile() {
        document.getElementById('global-profile-modal').classList.remove('show');
      }
      setInterval(checkAuthProfile, 1000);
      checkAuthProfile();

      /* Sidebar Navigation */
      let sidebarOpen = false;
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const hamburger = document.getElementById('hamburger-btn');

      function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        sidebar.classList.toggle('show', sidebarOpen);
        overlay.classList.toggle('show', sidebarOpen);
        hamburger.style.display = sidebarOpen ? 'inline-flex' : (window.innerWidth <= 768 ? 'inline-flex' : 'none');
      }
      function closeSidebar() {
        sidebarOpen = false;
        sidebar.classList.remove('show');
        overlay.classList.remove('show');
      }

      // Show hamburger only when logged in
      function checkAuthSidebar() {
        const token = localStorage.getItem('token');
        if (token) {
          hamburger.style.display = 'inline-flex';
          // On desktop, show sidebar by default
          if (window.innerWidth > 768) {
            sidebarOpen = true;
            sidebar.classList.add('show');
          }
        } else {
          hamburger.style.display = 'none';
          closeSidebar();
        }
      }

      // Highlight active nav item
      function highlightNav() {
        const path = window.location.pathname;
        document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
        if (path === '/' || path === '/index.html') document.getElementById('nav-dashboard')?.classList.add('active');
        else if (path.startsWith('/vault')) document.getElementById('nav-vault')?.classList.add('active');
        else if (path.startsWith('/notehub')) document.getElementById('nav-notehub')?.classList.add('active');
        else if (path.startsWith('/academics')) document.getElementById('nav-academics')?.classList.add('active');
        else if (path.startsWith('/assignment')) document.getElementById('nav-assignment')?.classList.add('active');
        else if (path.startsWith('/examination')) document.getElementById('nav-examination')?.classList.add('active');
        else if (path.startsWith('/timetable')) document.getElementById('nav-timetable')?.classList.add('active');
        else if (path.startsWith('/certificate')) document.getElementById('nav-certificate')?.classList.add('active');
        else if (path.startsWith('/events')) document.getElementById('nav-events')?.classList.add('active');
        else if (path.startsWith('/feedback')) document.getElementById('nav-feedback')?.classList.add('active');
        else if (path.startsWith('/accounts')) document.getElementById('nav-accounts')?.classList.add('active');
      }

      setInterval(checkAuthSidebar, 1000);
      checkAuthSidebar();
      highlightNav();
    </script>
  </body>
</html>
